<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌍 World Clock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1117}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#app{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;z-index:999999;background:#0d1117;}

/* ── Search bar ── */
#sb{
  display:flex;align-items:center;gap:10px;
  background:rgba(15,20,30,0.95);
  backdrop-filter:blur(12px);
  padding:10px 20px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  position:relative;z-index:50;flex-shrink:0;
}
#sb span{color:#4a9eff;font-size:15px}
#si{
  background:transparent;border:none;outline:none;
  color:#e8eaf0;font-size:13px;flex:1;
  letter-spacing:0.02em;
}
#si::placeholder{color:#3a4a5a}
#sr{
  position:absolute;top:calc(100% + 1px);left:0;right:0;
  background:rgba(10,15,25,0.97);backdrop-filter:blur(12px);
  max-height:240px;overflow-y:auto;display:none;z-index:100;
  border:1px solid rgba(255,255,255,0.08);
  border-top:none;border-radius:0 0 10px 10px;
}
.sri{
  padding:10px 20px;font-size:12px;cursor:pointer;
  color:#b0bec5;border-bottom:1px solid rgba(255,255,255,0.05);
  display:flex;gap:10px;align-items:center;
  transition:background 0.1s;
}
.sri:hover{background:rgba(74,158,255,0.12);color:#e8eaf0}.sri .flag{font-size:14px}

/* ── Main layout ── */
#maprow{display:flex;flex:1;overflow:hidden}
#mw{
  flex:1;position:relative;overflow:hidden;
  background:#060d16;cursor:grab;
  touch-action:none;user-select:none;
}
#mw.drag{cursor:grabbing}
#mc{display:block;position:absolute;top:0;left:0;z-index:1}
#os{position:absolute;top:0;left:0;pointer-events:none;z-index:2;overflow:visible}
#os .H{pointer-events:all;cursor:pointer}
#ld{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0d1827;font-size:14px;color:#4a9eff;font-weight:400;z-index:20;
  letter-spacing:0.05em;
}

/* ── Right sidebar ── */
#zb{
  display:flex;flex-direction:column;gap:6px;
  padding:20px 10px;
  background:rgba(10,15,25,0.95);
  backdrop-filter:blur(12px);
  align-items:center;justify-content:center;
  width:56px;flex-shrink:0;z-index:10;
  border-left:1px solid rgba(255,255,255,0.06);
}
.zb{
  width:36px;height:36px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;color:#7a8fa0;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;flex-shrink:0;
}
.zb:hover{background:rgba(74,158,255,0.15);border-color:rgba(74,158,255,0.3);color:#4a9eff}
.zb.on{background:rgba(74,158,255,0.2);border-color:rgba(74,158,255,0.4);color:#4a9eff}
.zbsep{width:24px;height:1px;background:rgba(255,255,255,0.07);margin:4px 0}
.zblabel{font-size:8px;color:#2a3a4a;letter-spacing:0.05em;text-transform:uppercase;margin-top:2px}

/* ── Info panel ── */
#ip{
  background:rgba(8,12,22,0.98);
  backdrop-filter:blur(16px);
  display:flex;flex-direction:column;
  flex-shrink:0;
  border-top:1px solid rgba(255,255,255,0.07);
}
#ip-row1{display:flex;align-items:stretch;min-height:58px;border-bottom:1px solid rgba(255,255,255,0.05)}
#il{padding:10px 20px;flex:1;min-width:0;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;justify-content:center;gap:3px}
#ir{padding:10px 16px;text-align:right;min-width:130px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#imeta{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid rgba(255,255,255,0.05)}
.imeta-section{display:flex;flex-wrap:wrap;align-items:stretch;border-right:1px solid rgba(255,255,255,0.08)}
.imeta-hdr{padding:4px 14px 2px;font-size:8px;color:#3a6070;letter-spacing:0.08em;text-transform:uppercase;width:100%;border-bottom:1px solid rgba(255,255,255,0.04)}
.iblock{padding:6px 16px;border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;justify-content:center;min-width:100px;flex:1}
.iblock-label{font-size:8px;color:#4a7a8a;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px}
.iblock-val{font-size:12px;color:#c8ddf0;font-weight:600}
#cn{
  font-size:14px;font-weight:600;color:#e0e6f0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;
}
#cs{font-size:9px;color:#2a4050;letter-spacing:0.03em}
#ct{
  font-size:26px;font-weight:200;color:#ffffff;
  font-variant-numeric:tabular-nums;letter-spacing:-1px;
  line-height:1;
}
#cd{font-size:9px;color:#2a4050;margin-top:2px}
.dn{
  display:inline-block;font-size:8px;margin-top:3px;
  padding:2px 7px;border-radius:20px;letter-spacing:0.04em;
}
.dy{background:rgba(255,180,0,0.12);color:#ffc040;border:1px solid rgba(255,180,0,0.2)}
.nt{background:rgba(80,120,255,0.12);color:#80a0ff;border:1px solid rgba(80,120,255,0.2)}
#wx{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#3a5060;margin-top:2px}
#ep{
  background:rgba(6,10,20,0.99);
  border-top:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;overflow:hidden;
  max-height:0;transition:max-height 0.3s ease;
}
#ep.open{max-height:160px}
#el{display:flex;flex-direction:column;gap:0;overflow-y:auto;max-height:160px}
.ev{padding:8px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:baseline;gap:10px;cursor:default}
.ev:hover{background:rgba(74,158,255,0.05)}
.ev-date{font-size:9px;color:#2a5060;min-width:70px;letter-spacing:0.04em}
.ev-title{font-size:11px;color:#8aaabb;flex:1}
.ev-cat{font-size:8px;color:#1a3040;padding:1px 5px;border:1px solid rgba(255,255,255,0.07);border-radius:3px;letter-spacing:0.05em}
#etoggle{cursor:pointer;padding:6px 20px;font-size:9px;color:#2a5060;letter-spacing:0.06em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,0.05);display:none;align-items:center;gap:6px;transition:color 0.15s}
#etoggle:hover{color:#4a9eff}

/* ── Airport popup ── */
#apop{
  background:rgba(10,15,28,0.97)!important;
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.1)!important;
  box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;
  color:#e0e6f0;
}
</style>
</head>
<body>
<div id="app">
<div id="sb">

<div id="maprow">

  </div>
</div>

<div id="rulerpanel" style="display:none;position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:rgba(5,12,28,0.94);border:1px solid rgba(74,158,255,0.25);border-radius:12px;padding:10px 18px;z-index:300;pointer-events:none;text-align:center;white-space:nowrap;font-size:12px;color:#cde;min-width:220px"></div>
<div id="ip">
  <div id="il">
    <div id="cn"><span id="cf">🌍</span><span id="cnm">Click a city</span></div>
    <div id="cs"></div>

  </div>
  <div id="ir">

</div>

  <span id="earrow">▲</span>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
'use strict';
const NK='a01fb6a9fc0648c09c9a1dbbe5cbaad5';
const VW=window.innerWidth-56; // 56px for sidebar
const mw=document.getElementById('mw');
const mc=document.getElementById('mc');
const os=document.getElementById('os');
const ctx=mc.getContext('2d',{willReadFrequently:false});
// Globe fills container - height set by flex
// Canvas is PAD pixels larger on each side so pan never shows edges
const PAD=0; // Globe-only, no pan buffer needed
const VH=Math.round(VW*0.44);
const CW=VW,CH=VH;
mc.width=CW;mc.height=CH;
mc.style.position='absolute';
mc.style.left='0px';mc.style.top='0px';
mw.style.height=VH+'px';
// mc is now just used for 2D overlay (night, SVG sync)
// WebGL canvas handles the actual globe texture

// // Don't set fixed height - let flex layout determine it
// mc and os resize on first draw using actual mw dimensions
os.style.position='absolute';
os.style.left='0px';os.style.top='0px';
os.setAttribute('width',VW);os.setAttribute('height',VH);
os.setAttribute('viewBox','0 0 '+VW+' '+VH);
os.style.width=VW+'px';os.style.height=VH+'px';
const CL=15,CT=18,BS=VW/(2*Math.PI),MN=1,MX=14;
let Z=1,VX=0,VY=0,feats=null,bord=null,coast=null;
let sel=null,clkI=null,showC=true,showA=false,apts=null,aptOk=false;
let drag=false,dx0=0,dy0=0,vx0=0,vy0=0,bvx=0,bvy=0;
let lpd=null,pmid=null,pvs=null;
let vvx=0,vvy=0,lmx=0,lmy=0,lmt=0,raf=null;
let wt=null,wa=1,wcx=VW/2,wcy=VH/2;
const FR=0.86;


function P(z,vx,vy){
  const s=BS*z;
  // Translate into padded canvas space (shift by PAD)
  return d3.geoEquirectangular().scale(s).translate([VW/2+PAD-s*(CL*Math.PI/180)+vx,VH/2+PAD+s*(CT*Math.PI/180)+vy]);
}
function Pvp(z,vx,vy){
  // Viewport projection (no PAD) - used for SVG elements
  const s=BS*z;
  return d3.geoEquirectangular().scale(s).translate([VW/2-s*(CL*Math.PI/180)+vx,VH/2+s*(CT*Math.PI/180)+vy]);
}
function C(z,vx,vy){
  const s=BS*z,tx=VW/2-s*(CL*Math.PI/180)+vx,ty=VH/2+s*(CT*Math.PI/180)+vy;
  let nx=vx,ny=vy;
  if(tx-s*Math.PI>0)nx-=(tx-s*Math.PI);
  if(tx+s*Math.PI<VW)nx+=(VW-(tx+s*Math.PI));
  if(ty-s*Math.PI/2>0)ny-=(ty-s*Math.PI/2);
  if(ty+s*Math.PI/2<VH)ny+=(VH-(ty+s*Math.PI/2));
  return[nx,ny];
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function getSun(now){
  const d=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  const dec=-23.45*Math.cos(2*Math.PI/365*(d+10));
  const h=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;
  return{l:-((h-12)/24)*360,t:dec};
}
function nA(lon,lat,s){
  const dl=(lon-s.l+180+360)%360-180,db=lat-s.t;
  const a=Math.sqrt(dl*dl*Math.cos(s.t*Math.PI/180)**2+db*db);
  // a < 84: day, 84-90: civil twilight, 90-102: nautical twilight, >102: night
  if(a<84) return 0;
  if(a<90) return Math.round((a-84)/6*40);   // civil twilight 0-40
  if(a<102) return Math.round(40+(a-90)/12*50); // nautical twilight 40-90
  return 90; // full night (max alpha)
}
function tok(t){return t===1||(t===2&&Z>=1.4)||(t===3&&Z>=2.5)||(t===4&&Z>=4.5);}
function olap(rs,x,y,w,h,p){p=p||2;for(var r of rs)if(x-p<r.x+r.w&&x+w+p>r.x&&y-p<r.y+r.h&&y+h+p>r.y)return true;return false;}

// ── RENDER ──
let rq=false;
function redraw(){
  if(!feats||rq)return;
  rq=true;
  requestAnimationFrame(function(){rq=false;draw();});
}
// Offscreen map cache - only redrawn on zoom change
var mapCache=document.createElement('canvas');
var mapCacheCtx=mapCache.getContext('2d');
var cacheZ=-1,cacheVX=0,cacheVY=0;

function buildMapCache(){
  mapCache.width=CW;mapCache.height=CH;
  drawGlobe(); // Globe-only mode - no PAD needed
}

function syncDimensions(){
  var mwW=mw.clientWidth, mwH=mw.clientHeight;
  if(mwW>0&&mwH>0){
    if(mc.width!==mwW||mc.height!==mwH){
      mc.width=mwW; mc.height=mwH;
      cacheZ=-1;
    }
    os.setAttribute('width',mwW);
    os.setAttribute('height',mwH);
    os.setAttribute('viewBox','0 0 '+mwW+' '+mwH);
    os.style.width=mwW+'px';
    os.style.height=mwH+'px';
  }
}

function draw(){
  if(!feats)return;
  syncDimensions();
  buildMapCache();
  ctx.clearRect(0,0,mc.width,mc.height);
  ctx.drawImage(mapCache,0,0);
  svgDrawGlobe();
  mw.style.transform='';bvx=VX;bvy=VY;
}

function mkEl(tag,a){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});
  return e;
}
var CLbls=[
  {n:'Russia',lat:62,lon:90,s:'big'},{n:'Canada',lat:58,lon:-97,s:'big'},
  {n:'USA',lat:40,lon:-98,s:'big'},{n:'Brazil',lat:-12,lon:-52,s:'big'},
  {n:'Australia',lat:-25,lon:133,s:'big'},{n:'China',lat:35,lon:105,s:'big'},
  {n:'India',lat:22,lon:80,s:'big'},{n:'Sahara',lat:22,lon:10,s:'big'},
  {n:'Greenland',lat:72,lon:-42,s:'med'},{n:'Argentina',lat:-38,lon:-65,s:'med'},
  {n:'Saudi Arabia',lat:24,lon:45,s:'med'},{n:'Mexico',lat:24,lon:-102,s:'med'},
  {n:'Indonesia',lat:-3,lon:118,s:'med'},{n:'Iran',lat:32,lon:54,s:'med'},
  {n:'Nigeria',lat:9,lon:8,s:'med'},{n:'Egypt',lat:26,lon:30,s:'med'},
  {n:'New Zealand',lat:-41,lon:172,s:'small'},{n:'Hawaii',lat:20,lon:-157,s:'small'}
];

function svgDraw(S,Pr){
  // Use viewport projection for SVG (SVG is VW x VH, no PAD)
  Pr=Pvp(Z,VX,VY);
  os.innerHTML='';
  if(Z<8){
    for(var tz=-180;tz<=180;tz+=15){var xa=Pr([tz,0]);if(xa[0]<-5||xa[0]>CW+5)continue;os.appendChild(mkEl('line',{x1:xa[0],y1:0,x2:xa[0],y2:CH,stroke:'rgba(0,0,0,0.04)','stroke-width':'0.5'}));}
    var ey=Pr([0,0]);if(ey[1]>0&&ey[1]<CH)os.appendChild(mkEl('line',{x1:0,y1:ey[1],x2:CW,y2:ey[1],stroke:'rgba(0,0,0,0.08)','stroke-width':'0.5','stroke-dasharray':'4,8'}));
  }
  CLbls.forEach(function(c){
    if(c.s==='big'&&Z<0.65)return;if(c.s==='med'&&Z<1.2)return;if(c.s==='small'&&Z<2.2)return;
    var xy=Pr([c.lon,c.lat]);if(xy[0]<0||xy[0]>CW||xy[1]<0||xy[1]>CH)return;
    var fs=Math.max(6,Math.min(13,7*Math.pow(Z,0.38)));
    var t=mkEl('text',{x:xy[0],y:xy[1],'text-anchor':'middle','font-size':fs,fill:'rgba(80,90,70,0.7)','letter-spacing':'1','font-weight':'600'});
    t.textContent=c.n.toUpperCase();os.appendChild(t);
  });
  var sx=Pr([S.l,S.t]);
  if(sx[0]>0&&sx[0]<VW&&sx[1]>0&&sx[1]<VH){
    os.appendChild(mkEl('circle',{cx:sx[0],cy:sx[1],r:12,fill:'#FFE566',opacity:'0.25'}));
    os.appendChild(mkEl('circle',{cx:sx[0],cy:sx[1],r:5,fill:'#FFB700',opacity:'0.9'}));
  }
  var fs2=Math.max(6,Math.min(11,8*Math.pow(Z,0.3))),lh=fs2+2;
  var placed=[],seen={},vis=[];
  if(showC)cities.forEach(function(c,i){
    if(!tok(c.tier))return;if(seen[c.n])return;seen[c.n]=1;
    var xy=Pr([c.lon,c.lat]);vis.push({c:c,i:i,x:xy[0],y:xy[1]});
  });
  vis.sort(function(a,b){if(a.i===sel)return -1;if(b.i===sel)return 1;if(a.c.cap&&!b.c.cap)return -1;if(!a.c.cap&&b.c.cap)return 1;return a.c.tier-b.c.tier;});
  vis.forEach(function(v){
    var c=v.c,i=v.i,x=v.x,y=v.y;
    var iS=i===sel;
    var dr=iS?6:c.cap?Math.max(2,3/Math.pow(Z,0.28)):Math.max(1.2,2/Math.pow(Z,0.3));
    if(!iS&&!c.cap&&olap(placed,x-dr,y-dr,dr*2,dr*2,1))return;
    placed.push({x:x-dr,y:y-dr,w:dr*2,h:dr*2});
    var H=mkEl('circle',{cx:x,cy:y,r:Math.max(12,dr+8),fill:'transparent',style:'pointer-events:all;cursor:pointer'});
    H.classList.add('H');
    (function(ii){
      H.addEventListener('mousedown',function(e){
        e.stopPropagation();
        var sx=e.clientX,sy=e.clientY;
        function onUp(e2){
          window.removeEventListener('mouseup',onUp);
          if(Math.sqrt(Math.pow(e2.clientX-sx,2)+Math.pow(e2.clientY-sy,2))<5){selCity(ii);}
        }
        window.addEventListener('mouseup',onUp);
      });
      H.addEventListener('touchend',function(e){e.stopPropagation();selCity(ii);});
    })(i);
    os.appendChild(H);
    if(iS){os.appendChild(mkEl('circle',{cx:x,cy:y+1,r:dr+4,fill:'rgba(234,67,53,0.18)'}));os.appendChild(mkEl('circle',{cx:x,cy:y,r:dr,fill:'#ea4335'}));os.appendChild(mkEl('circle',{cx:x,cy:y,r:dr*0.4,fill:'#fff',opacity:'0.8'}));}
    else if(c.cap){os.appendChild(mkEl('circle',{cx:x,cy:y,r:dr,fill:'#555',opacity:'0.85'}));os.appendChild(mkEl('circle',{cx:x,cy:y,r:dr*0.45,fill:'#fff',opacity:'0.9'}));}
    else os.appendChild(mkEl('circle',{cx:x,cy:y,r:dr,fill:'#777',opacity:'0.7'}));
    var wL=iS||(c.tier===1&&Z>=0.7)||(c.tier===2&&Z>=1.5)||(c.tier===3&&Z>=2.8)||(c.tier===4&&Z>=5);
    if(!wL)return;
    var fz=iS?Math.max(9,fs2):fs2,lw=c.n.length*fz*0.56;
    var lx=x+dr+2.5,lX=lx,si=1;
    if(!iS&&olap(placed,lx,y-lh*0.7-fz*0.35,lw,lh)){var lL=x-dr-2.5-lw;if(!olap(placed,lL,y-lh*0.7-fz*0.35,lw,lh)){lX=lL;si=-1;}else return;}

var _wgl={gl:null,prog:null,tex:null,buf:null,ready:false};
function initWebGL(){
  var c=document.getElementById('wglc');
  if(!c)return;
  var gl=c.getContext('webgl',{alpha:true,premultipliedAlpha:false});
  if(!gl){return;}
  var vs=`attribute vec2 a;varying vec2 v;void main(){v=a*0.5+0.5;gl_Position=vec4(a,0,1);}`;
  var fs=`precision highp float;
  uniform sampler2D tex;
  uniform vec2 center;uniform float scale;uniform vec2 rotate;uniform float aspect;
  varying vec2 v;
  #define PI 3.14159265
  void main(){
    // Screen pos in normalized globe coords (-1..1 range within globe)
    vec2 sc=vec2((v.x*2.0-1.0)*aspect, -(v.y*2.0-1.0));
    float nx=(sc.x-center.x)/scale;
    float ny=-(sc.y-center.y)/scale; // flip Y: canvas top=0, WebGL Y=1 at top
    float r2=nx*nx+ny*ny;
    if(r2>1.0){discard;}
    float nz=sqrt(max(0.0,1.0-r2));
    // Rotate point by globe rotation (inverse of display rotation)
    float cosLon=cos(-rotate.x), sinLon=sin(-rotate.x);
    float x1=nx*cosLon-nz*sinLon;
    float z1=nx*sinLon+nz*cosLon;
    float cosLat=cos(-rotate.y), sinLat=sin(-rotate.y);
    float y2=ny*cosLat-z1*sinLat;
    float z2=ny*sinLat+z1*cosLat;
    float lon=atan(x1,z2);
    float lat=asin(clamp(y2,-1.0,1.0));
    float u=mod(lon/(2.0*PI)+0.5,1.0);
    float vv=0.5-lat/PI;
    gl_FragColor=texture2D(tex,vec2(u,vv));
  }`;
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  var prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  _wgl={gl:gl,prog:prog,buf:buf,tex:null,ready:false,c:c};
}

function renderWebGLGlobe(W,H,cx,cy,globeScale,globeLon,globeLat){

  mapCacheCtx.imageSmoothingEnabled=true;mapCacheCtx.drawImage(nt,0,0,W,H);mapCacheCtx.restore();

  mapCacheCtx.fillStyle=limb;mapCacheCtx.fill();mapCacheCtx.restore();

  // Globe outline
  mapCacheCtx.beginPath();mapCacheCtx.arc(cx,cy,globeScale,0,Math.PI*2);
  mapCacheCtx.strokeStyle='rgba(50,130,220,0.35)';mapCacheCtx.lineWidth=1.0;mapCacheCtx.stroke();

  cacheZ=Z;cacheVX=VX;cacheVY=VY;
}

if(!globeMode||e.button!==0)return;

// Smooth zoom: accumulated CSS scale during scroll (GPU, instant)
// Canvas redraws only when scroll pauses
var _scaleBase=null;
var _zoomPending=false;
var _zoomActive=false; // globeScale at start of scroll gesture

function onGlobeWheel(e){
  if(!globeMode)return;
  e.preventDefault();
  var delta=e.deltaY;
  if(e.deltaMode===1) delta*=30;
  if(e.deltaMode===2) delta*=300;
  var capped=Math.sign(delta)*Math.min(Math.abs(delta),20);
  var factor=Math.pow(0.97,capped);
  // If new gesture, snapshot current scale
  if(_scaleBase===null) _scaleBase=globeScale;
  globeScale=Math.max(80,Math.min(8000,globeScale*factor));
  if(globeScale>400) load50m();
  // No CSS transform - causes streaks. Just redraw with RAF throttle.
  _zoomActive=true;
  if(!_zoomPending){
    _zoomPending=true;
    requestAnimationFrame(function(){
      _zoomPending=false;
      cacheZ=-1; draw();
    });
  }
  // Full quality redraw after scroll stops
  clearTimeout(_zoomTimer);
  _zoomTimer=setTimeout(function(){
    _scaleBase=null;
    _zoomActive=false;
    cacheZ=-1; redraw();
  },120);
}

// Double-click: zoom in 2x toward click point
mw.addEventListener('dblclick',function(e){
  e.preventDefault();
  var rect=mw.getBoundingClientRect();
  var cx=e.clientX-rect.left;
  var cy=e.clientY-rect.top;
  var proj=getGlobeProj();
  var geo=proj.invert([cx,cy]);
  if(!geo)return;
  // Target: clicked geo point becomes center of globe
  var targetLon=-geo[0];
  var targetLat=-geo[1]; // No multiplier - exact centering
  var startLon=globeLon, startLat=globeLat, startScale=globeScale;
  var endScale=Math.min(8000,globeScale*2.5);
  var steps=30, step=0;
  var anim=setInterval(function(){
    step++;
    var t=step/steps;
    var ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    globeLon=startLon+(targetLon-startLon)*ease;
    globeLat=startLat+(targetLat-startLat)*ease;
    globeScale=startScale+(endScale-startScale)*ease;
    cacheZ=-1; redraw();
    if(step>=steps)clearInterval(anim);
  },16);
});

    var aptFill=isSelected?'#ff4466':'#3aafff';
    // Glow
    os.appendChild(mkEl('circle',{cx:xy[0],cy:xy[1],r:ar*3,fill:aptFill,opacity:'0.12',style:'pointer-events:none'}));
    // Triangle
    os.appendChild(mkEl('polygon',{
      points:''+xy[0]+','+(xy[1]-ar*1.8)+' '+(xy[0]-ar)+','+(xy[1]+ar)+' '+(xy[0]+ar)+','+(xy[1]+ar),
      fill:aptFill,opacity:'0.95',stroke:'rgba(255,255,255,0.4)','stroke-width':'0.5',style:'pointer-events:none'
    }));
    if(globeScale>300&&ap.iata){
      var lb=mkEl('text',{x:xy[0]+ar+2,y:xy[1]+ar*0.4,'text-anchor':'start','font-size':7.5,fill:'#80c8ff','paint-order':'stroke',stroke:'rgba(5,10,25,0.85)','stroke-width':'2',style:'pointer-events:none'});
      lb.textContent=ap.iata;os.appendChild(lb);
    }
    var H=mkEl('circle',{cx:xy[0],cy:xy[1],r:Math.max(12,ar+8),fill:'transparent',style:'pointer-events:all;cursor:pointer'});
    (function(a){
      H.addEventListener('mousedown',function(e){
        e.stopPropagation();
        var sx=e.clientX,sy=e.clientY;
        function onUp(e2){
          window.removeEventListener('mouseup',onUp);
          if(Math.sqrt(Math.pow(e2.clientX-sx,2)+Math.pow(e2.clientY-sy,2))<5) selectAirport(a);
        }
        window.addEventListener('mouseup',onUp);
      });
    })(ap);
    aH.push(H);
  });
  aH.forEach(function(h){os.appendChild(h);});
  // Route lines in globe mode
  if(selApt&&routeLines.length) drawGlobeRouteLines(proj);
}

function drawGlobeRouteLines(proj){
  var srcApt=null;
  for(var i=0;i<AIRPORT_DATA.length;i++){if(AIRPORT_DATA[i][2]===selApt){srcApt=AIRPORT_DATA[i];break;}}
  if(!srcApt)return;
  var sx=proj([srcApt[1],srcApt[0]]);
  if(!sx)return;
  var pathFn=d3.geoPath().projection(proj);
  routeLines.forEach(function(r){
    var feature={type:'Feature',geometry:{type:'LineString',
      coordinates:[[srcApt[1],srcApt[0]],[r.dst[0],r.dst[1]]]}};
    var d=pathFn(feature);
    if(!d)return;
    os.appendChild(mkEl('path',{d:d,stroke:'rgba(74,158,255,0.45)',
      'stroke-width':'1.2',fill:'none','stroke-dasharray':'4,3',style:'pointer-events:none'}));
    var dx=proj([r.dst[0],r.dst[1]]);
    if(dx)os.appendChild(mkEl('circle',{cx:dx[0],cy:dx[1],r:2.5,
      fill:'#4a9eff',opacity:'0.9',style:'pointer-events:none'}));
  });
  os.appendChild(mkEl('circle',{cx:sx[0],cy:sx[1],r:7,fill:'none',
    stroke:'#ff4466','stroke-width':'2',opacity:'0.9',style:'pointer-events:none'}));
}

function setupGlobeEvents(){
  mw.addEventListener('mousedown',onGlobeMousedown);
  window.addEventListener('mousemove',onGlobeMousemove);
  window.addEventListener('mouseup',onGlobeMouseup);
  mw.addEventListener('wheel',onGlobeWheel,{passive:false});
}
function removeGlobeEvents(){
  mw.removeEventListener('mousedown',onGlobeMousedown);
  window.removeEventListener('mousemove',onGlobeMousemove);
  window.removeEventListener('mouseup',onGlobeMouseup);
  mw.removeEventListener('wheel',onGlobeWheel);
}

// ── EVENTS (AI-powered) ──
var evCache={};
var ANTHROPIC_KEY=''; // Add your key here, or use Vercel endpoint

function fetchEvents(country,cc){
  var el=document.getElementById('el');
  var ep=document.getElementById('ep');
  var toggle=document.getElementById('etoggle');
  if(!el||!ep||!toggle)return;
  toggle.style.display='flex';
  if(evCache[cc]){renderEvents(evCache[cc]);return;}
  el.innerHTML='<div class="ev"><div class="ev-title" style="color:#2a5060">Loading upcoming events...</div></div>';
  ep.classList.add('open');

  var prompt='List 5 important upcoming events or news for '+country+' in 2025-2026. '+
    'Return ONLY a JSON array, no markdown. Each item: {date:"MMM YYYY",title:"short title",cat:"Politics|Economy|Sports|Culture|Science"}. '+
    'Focus on real scheduled events: elections, major sports, summits, cultural events.';

  if(!ANTHROPIC_KEY){
    // Show placeholder
    el.innerHTML='<div class="ev"><div class="ev-title" style="color:#2a5060">Add Anthropic API key to enable live events</div></div>';
    return;
  }
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01',
      'x-api-key':ANTHROPIC_KEY,'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var text=(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var m=text.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('no json');
    var events=JSON.parse(m[0]);
    evCache[cc]=events;
    renderEvents(events);
  })
  .catch(function(){
    el.innerHTML='<div class="ev"><div class="ev-title" style="color:#2a5060">Events unavailable</div></div>';
  });
}

function renderEvents(events){
  var el=document.getElementById('el');
  var ep=document.getElementById('ep');
  var ec=document.getElementById('ecount');
  if(!el)return;
  ep.classList.add('open');
  if(ec)ec.textContent='('+events.length+')';
  el.innerHTML='';
  events.forEach(function(e){
    var row=document.createElement('div');
    row.className='ev';
    row.innerHTML='<div class="ev-date">'+e.date+'</div>'+
      '<div class="ev-title">'+e.title+'</div>'+
      '<div class="ev-cat">'+(e.cat||'')+'</div>';
    el.appendChild(row);
  });
}

// Toggle events panel
document.addEventListener('click',function(e){
  if(e.target.closest('#etoggle')){
    var ep=document.getElementById('ep');
    var arrow=document.getElementById('earrow');
    if(ep.classList.contains('open')){
      ep.classList.remove('open');
      if(arrow)arrow.textContent='▲';
    } else {
      ep.classList.add('open');
      if(arrow)arrow.textContent='▼';
    }
  }
});

  ferryRouteMap[r[1]].push(r[0]);
});

var routeLines=[];   // [{src,dst}] IATA pairs to draw
var selApt=null;     // currently selected airport IATA
var routeMap={};     // {IATA: [IATA,...]} built from routes.dat
var aptCoords={};    // {IATA: [lat,lon]} from Jonty's data (full ~3500 airports)
var routesLoaded=false;
var routesLoading=false;

function loadRoutes(cb){
  if(routesLoaded){cb();return;}
  if(routesLoading){setTimeout(function(){loadRoutes(cb);},200);return;}
  routesLoading=true;
  // Jonty's airline-route-data: weekly updated, includes charter, indexed by IATA
  var url='https://raw.githubusercontent.com/Jonty/airline-route-data/refs/heads/main/airline_routes.json';
  fetch(url)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(data){
      // Build routeMap AND a full coord lookup from Jonty's data
      var count=0;
      Object.keys(data).forEach(function(src){
        var airport=data[src];
        if(!airport||!airport.routes||!airport.routes.length)return;
        routeMap[src]=airport.routes.map(function(r){return r.iata;});
        // Store coords if available in Jonty's data
        if(airport.lat&&airport.lon){
          aptCoords[src]=[airport.lat,airport.lon];
        }
        count++;
      });
      console.log('Routes loaded for',count,'airports. CPH:',routeMap['CPH']?routeMap['CPH'].length:0,'routes');
      console.log('Coords cached:',Object.keys(aptCoords).length);
      routesLoaded=true;
      routesLoading=false;
      cb();
    })
    .catch(function(e){
      routesLoading=false;
      console.warn('Routes load failed:',e);
      cb();
    });
}

function selectAirport(ap){
  if(!showA)return;
  // Toggle off if clicking same airport
  if(selApt&&selApt===ap.iata){selApt=null;routeLines=[];redraw();return;}
  selApt=ap.iata;
  routeLines=[];
  // Show loading indicator in popup
  showRoutePopup(ap,[],true);
  loadRoutes(function(){
    var dests=routeMap[ap.iata]||[];
    // Build coord pairs for drawing
    routeLines=[];
    dests.forEach(function(iata){
      // First try AIRPORT_DATA, then aptCoords from Jonty's data
      var lat=null,lon=null,name=iata;
      for(var i=0;i<AIRPORT_DATA.length;i++){
        if(AIRPORT_DATA[i][2]===iata){lat=AIRPORT_DATA[i][0];lon=AIRPORT_DATA[i][1];name=AIRPORT_DATA[i][3];break;}
      }
      if(lat===null&&aptCoords[iata]){lat=aptCoords[iata][0];lon=aptCoords[iata][1];}
      if(lat!==null){routeLines.push({src:[ap.lon,ap.lat],dst:[lon,lat],iata:iata,name:name});}
    });
    showRoutePopup(ap,routeLines,false);
    redraw();
  });
}

function drawRouteLines(){
  var Pr=Pvp(Z,VX,VY);
  if(!routeLines.length)return;
  var srcApt=null;
  for(var i=0;i<AIRPORT_DATA.length;i++){if(AIRPORT_DATA[i][2]===selApt){srcApt=AIRPORT_DATA[i];break;}}
  if(!srcApt)return;
  var sx=Pr([srcApt[1],srcApt[0]]);

  routeLines.forEach(function(r){
    var dx=Pr([r.dst[0],r.dst[1]]);
    if(dx[0]<-200||dx[0]>VW+200||dx[1]<-200||dx[1]>VH+200)return;

    // Draw great-circle arc using intermediate points
    var steps=20;
    var pts=[];
    for(var s=0;s<=steps;s++){
      var t=s/steps;
      // Simple linear interpolation in lon/lat space (close enough for map display)
      var lon=srcApt[1]+(r.dst[0]-srcApt[1])*t;
      var lat=srcApt[0]+(r.dst[1]-srcApt[0])*t;
      pts.push(Pr([lon,lat]));
    }

    // Draw as SVG path
    var d='M'+pts[0][0]+','+pts[0][1];
    for(var j=1;j<=steps;j++){d+=' L'+pts[j][0]+','+pts[j][1];}
    var path=mkEl('path',{
      d:d,
      stroke:'rgba(41,128,185,0.5)',
      'stroke-width': Z>3?'1.5':'1',
      fill:'none',
      'stroke-dasharray':'4,3',
      style:'pointer-events:none'
    });
    os.appendChild(path);

    // Dot at destination
    os.appendChild(mkEl('circle',{cx:dx[0],cy:dx[1],r:Math.max(2,3*Math.pow(Z,0.2)),
      fill:'#2980b9',opacity:'0.7',style:'pointer-events:none'}));
  });

  // Highlight source airport
  os.appendChild(mkEl('circle',{cx:sx[0],cy:sx[1],r:8,fill:'none',
    stroke:'#2980b9','stroke-width':'2',opacity:'0.9',style:'pointer-events:none'}));
}

  var centerLon=(minLon+maxLon)/2;
  var spanLat=maxLat-minLat;
  var spanLon=maxLon-minLon;
  var W=mw.clientWidth||VW, H=mw.clientHeight||VH;
  // Scale so country fits with padding
  var scaleFromLat=(H*0.8)/(spanLat*Math.PI/180);
  var scaleFromLon=(W*0.8)/(spanLon*Math.PI/180);
  var targetScale=Math.max(80,Math.min(8000,Math.min(scaleFromLat,scaleFromLon)));
  var targetLon=-centerLon;
  var targetLat=-centerLat;
  var steps=30,step=0;
  var anim=setInterval(function(){
    step++;
    var t=step/steps;
    var ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    globeLon=startLon+(targetLon-startLon)*ease;
    globeLat=startLat+(targetLat-startLat)*ease;
    globeScale=startScale+(targetScale-startScale)*ease;
    cacheZ=-1;redraw();
    if(step>=steps){clearInterval(anim);if(cb)cb();}
  },16);
}

function selCountry(cc,country,flag){
  var startLon=globeLon,startLat=globeLat,startScale=globeScale;
  zoomToCountry(cc,startLon,startLat,startScale,function(){
    // After zoom, select capital city to show info panel
    var cap=null,first=null;
    for(var i=0;i<cities.length;i++){
      var inf=cityInfo[cities[i].n]||{};
      if(inf.cc===cc){
        if(!first)first=i;
        if(cities[i].cap){cap=i;break;}
      }
    }
    var idx=cap!==null?cap:(first!==null?first:null);
    if(idx!==null) selCity(idx);
  });
}

    hdr2.textContent='Cities';

        '<span style="flex:1">'+c.n+'</span>'+

      (function(cc){d.onclick=function(){selCity(cities.indexOf(cc));si.value='';sr.style.display='none';};})(c);
      sr.appendChild(d);

  sr.style.display=count>0?'block':'none';

// ── LOAD MAP — dynamic LOD ──
// 110m loads first (fast), 50m loads in background for zoom-in detail
var feats110=null, bord110=null, coast110=null;
var feats50=null,  bord50=null,  coast50=null;
var lod50loaded=false, lod50loading=false;

function applyTopo(w){
  return {
    feats: topojson.feature(w,w.objects.countries).features,
    bord:  topojson.mesh(w,w.objects.countries,function(a,b){return a!==b;}),
    coast: topojson.mesh(w,w.objects.countries,function(a,b){return a===b;})
  };
}

function useLOD(){
  // Switch to 50m when zoomed in enough (scale > 800px radius)
  if(lod50loaded && globeScale>600){
    feats=feats50; bord=bord50; coast=coast50;
  } else {
    feats=feats110; bord=bord110; coast=coast110;
  }
}

function load50m(){
  if(lod50loading||lod50loaded)return;
  lod50loading=true;
  var urls=[
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json',
    'https://unpkg.com/world-atlas@2/countries-50m.json'
  ];
  function try50(i){
    if(i>=urls.length){lod50loading=false;return;}
    fetch(urls[i])
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
      .then(function(w){
        var d=applyTopo(w);
        feats50=d.feats; bord50=d.bord; coast50=d.coast;
        lod50loaded=true; lod50loading=false;
        // If already zoomed in, switch immediately
        useLOD(); cacheZ=-1; redraw();
      })
      .catch(function(){try50(i+1);});
  }
  try50(0);
}

var mapUrls=[
  'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  'https://unpkg.com/world-atlas@2/countries-110m.json'
];
function tryLoad(i){
  if(i>=mapUrls.length){document.getElementById('ld').textContent='Error loading map';return;}
  var ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort();},8000);
  fetch(mapUrls[i],{signal:ctrl.signal})
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(w){
      var d=applyTopo(w);
      feats110=d.feats; bord110=d.bord; coast110=d.coast;
      feats=feats110; bord=bord110; coast=coast110;
      document.getElementById('ld').style.display='none';
      redraw();
      setInterval(redraw,300000);
      // Load 50m in background after 2s (don't compete with initial render)
      setTimeout(load50m, 2000);
    })
    .catch(function(e){clearTimeout(t);console.warn('CDN fail',mapUrls[i],e.message);tryLoad(i+1);});
}
tryLoad(0);
setupGlobeEvents();
// Preload route data immediately
loadRoutes(function(){});

function savePermalink(){
  var rot=getGlobeProj().rotate();
  var p='?lon='+Math.round(-rot[0]*10)/10+'&lat='+Math.round(-rot[1]*10)/10+'&z='+Math.round(globeScale);
  history.replaceState(null,'',p);
}
function loadPermalink(){
  var p=new URLSearchParams(window.location.search);
  if(p.has('lon')&&p.has('lat')){
    var lon=parseFloat(p.get('lon')),lat=parseFloat(p.get('lat'));
    if(!isNaN(lon)&&!isNaN(lat)){
      VX=-lon;VY=-lat;
      if(p.has('z'))globeScale=Math.max(50,Math.min(2000,parseFloat(p.get('z'))));
      cacheZ=-1;redraw();
    }
  }
}
loadPermalink();
var _plT;
function deferSavePermalink(){clearTimeout(_plT);_plT=setTimeout(savePermalink,800);}





// ── RULER TOOL ──
var rulerMode=false, rulerPts=[], rulerNames=[];

function haversineKm(la1,lo1,la2,lo2){
  var R=6371,r=Math.PI/180;
  var dL=(la2-la1)*r, dO=(lo2-lo1)*r;
  var a=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dO/2)*Math.sin(dO/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function rulerTotalDist(){
  var total=0;
  for(var i=1;i<rulerPts.length;i++)
    total+=haversineKm(rulerPts[i-1][1],rulerPts[i-1][0],rulerPts[i][1],rulerPts[i][0]);
  return total;
}

function rulerSegLabel(i){
  var n=rulerPts.length;
  if(i===0)return 'From';
  if(i===n-1)return 'To';
  return 'Stop '+(i);
}

function rulerUpdatePanel(){
  var p=document.getElementById('rulerpanel'); if(!p)return;
  if(!rulerMode){p.style.display='none';return;}
  p.style.display='block';

  if(rulerPts.length===0){
    p.innerHTML='<span style="color:#4a9eff;font-weight:600">📏 Distance</span>&nbsp;&nbsp;Click first point on the globe';
    return;
  }

  // Build route string
  var route=rulerPts.map(function(_,i){
    var col=i===0?'#ffcc44':i===rulerPts.length-1?'#44ddff':'#80e0a0';
    return '<span style="color:'+col+';font-size:10px">⬤ '+rulerSegLabel(i)+'</span>';
  }).join('<span style="color:#5a8090;margin:0 4px">→</span>');

  if(rulerPts.length===1){
    p.innerHTML=route+'<span style="color:#5a8090;margin:0 8px">→</span>'
      +'<span style="color:#aaa;font-size:10px">click next point</span>';
    return;
  }

  // Segment distances
  var segs='';
  if(rulerPts.length>2){
    segs='<div style="margin-top:4px;font-size:9px;color:#4a7080">';
    for(var i=1;i<rulerPts.length;i++){
      var sd=haversineKm(rulerPts[i-1][1],rulerPts[i-1][0],rulerPts[i][1],rulerPts[i][0]);
      segs+='<span style="margin-right:8px">'+rulerSegLabel(i-1)+'→'+rulerSegLabel(i)+': '
        +Math.round(sd).toLocaleString('en-GB')+' km</span>';
    }
    segs+='</div>';
  }

  var total=rulerTotalDist();
  var km=Math.round(total).toLocaleString('en-GB');
  var mi=Math.round(total/1.609).toLocaleString('en-GB');

  p.innerHTML=route
    +'<br><span style="font-size:15px;font-weight:700;color:#fff;letter-spacing:0.02em">'+km+' km</span>'
    +'<span style="color:#5a8090;margin:0 8px">|</span>'
    +'<span style="font-size:13px;color:#80c0d0">'+mi+' mi</span>'
    +segs
    +'<br><span style="font-size:9px;color:#3a5060">Add more points &nbsp;·&nbsp; '
    +'<span id="rulerundo" style="cursor:pointer;color:#4a9eff;pointer-events:all">↩ Undo</span>'
    +' &nbsp;·&nbsp; <span id="rulerclear" style="cursor:pointer;color:#4a9eff;pointer-events:all">✕ Clear</span></span>';

  // Attach undo/clear handlers after render
  setTimeout(function(){
    var u=document.getElementById('rulerundo');
    if(u)u.onclick=function(e){e.stopPropagation();rulerPts.pop();rulerNames.pop();rulerUpdatePanel();redraw();};
    var c=document.getElementById('rulerclear');
    if(c)c.onclick=function(e){e.stopPropagation();rulerPts=[];rulerNames=[];rulerUpdatePanel();redraw();};
  },0);
}


document.getElementById('zruler').addEventListener('click',function(){
  rulerMode=!rulerMode;
  rulerPts=[]; rulerNames=[];
  this.style.color=rulerMode?'#4a9eff':'#7a8fa0';
  document.body.style.cursor=rulerMode?'crosshair':'';
  rulerUpdatePanel();
  redraw();
});

window.addEventListener('resize',function(){
  clearTimeout(window._rt);
  window._rt=setTimeout(function(){location.reload();},500);
});
</script>
